<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!--
      Ids are prefixed, not reused from the other plugins: the Plugin Store
      lists several icons on one page, and duplicate gradient ids would have
      each plugin painted in whichever one loaded last.
    -->
    <linearGradient id="sioBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="sioSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#sioBg)"/>
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#sioSheen)"/>
  <!--
    A chain of two links, the second one shortened. Two hooks facing each other
    rather than two closed rings: rings side by side read as spectacles, and
    overlapping them closes up the counters. Stroke 9, ring height 36, and the
    box works out at x 7..93 so the mark sits centred on the tile.
  -->
  <g fill="#ffffff">
    <path d="M48 32H25A18 18 0 0 0 25 68H48V59H25A9 9 0 0 1 25 41H48Z"/>
    <rect x="48" y="46" width="12" height="8"/>
    <path d="M60 32H75A18 18 0 0 1 75 68H60V59H75A9 9 0 0 0 75 41H60Z"/>
  </g>
</svg>
